<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart | Alberto Clock</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet"><style> :root{--navy:#09243b;--gold:#b59665;--cream:#f3eee7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}header{background:#09243b;color:#fff;padding:22px max(5%,calc((100% - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}header strong{font:27px 'Playfair Display',serif;letter-spacing:3px}nav{display:flex;gap:20px;font-size:13px}main{max-width:1180px;margin:auto;padding:60px 22px;min-height:65vh}h1,h2{font-family:'Playfair Display',serif}h1{font-size:clamp(36px,5vw,56px);margin:0 0 12px}.sub{color:#65717c;margin-bottom:36px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:25px}.panel{background:#fff;border:1px solid #e4ddd2;border-radius:15px;padding:25px;margin-bottom:18px;box-shadow:0 12px 30px #09243b0b}.item{display:grid;grid-template-columns:100px 1fr auto;gap:20px;align-items:center;border-bottom:1px solid #eee5db;padding:18px 0}.item:last-child{border:0}.item img{width:100px;height:110px;object-fit:cover;border-radius:8px}.item h3{font:21px 'Playfair Display',serif;margin:0 0 8px}.muted{color:#78818a;font-size:12px}.qty{display:flex;gap:12px;align-items:center;margin-top:14px}.qty button,.remove{background:#fff;border:1px solid #d9c9b0;padding:7px 11px;border-radius:6px;color:#09243b}.remove{margin-top:10px}.total{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #e7dfd5}.total.final{font-size:22px;font-weight:700;border:0}.btn{background:#09243b;color:white;border:0;border-radius:30px;padding:15px 24px;font-size:12px;font-weight:700;letter-spacing:1px;display:inline-block;text-align:center;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.gold{background:#b59665;color:#09243b}.wide{width:100%;margin-top:22px}label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field{margin-bottom:17px}input,textarea,select{width:100%;border:1px solid #d9d4cb;border-radius:8px;background:white;padding:14px;font:14px 'DM Sans',sans-serif;color:#09243b}textarea{min-height:100px}footer{background:#061827;color:#c2cbd2;padding:35px;text-align:center;font-size:12px}.notice{padding:15px;background:#f8f2e8;border-left:3px solid #b59665;line-height:1.7;font-size:13px;margin:18px 0}.error{color:#ad3030;font-size:13px;line-height:1.6}.ok{color:#236c49;font-size:13px}.actions{display:flex;gap:12px;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e7dfd5;padding:13px 9px;vertical-align:top}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #b59665;outline-offset:3px}@media(max-width:750px){.layout{grid-template-columns:1fr}.item{grid-template-columns:75px 1fr;gap:12px}.item img{width:75px;height:90px}.item .price{grid-column:2}main{padding:40px 15px}.panel{padding:17px}} </style></head><body><header><a href="index.html"><strong>ALBERTO CLOCK</strong></a><nav><a href="index.html">Home</a><a href="index.html#signature">Collections</a><a href="cart.html">Cart <span id="cartCount">0</span></a></nav></header><main><h1>Your Shopping Bag</h1><p class="sub">Review your selected timepieces.</p><div class="layout"><section class="panel" id="items"></section><aside class="panel"><h2>Order Summary</h2><div class="total"><span>Subtotal</span><strong id="subtotal"></strong></div><div class="total"><span>Delivery</span><span>Calculated at checkout</span></div><a href="checkout.html" class="btn wide" id="checkout">PROCEED TO CHECKOUT →</a><p class="muted">Final prices are verified by our server.</p></aside></div></main><footer>ALBERTO CLOCK · MORE THAN JUST TIME</footer><script src="config.js"></script><script src="store.js"></script><script>function refreshCount(){document.getElementById('cartCount').textContent=AlbertoStore.count()}refreshCount();window.addEventListener('alberto-cart-changed',refreshCount);</script><script>const S=AlbertoStore;function render(){let items=S.read();document.getElementById('items').innerHTML=items.length?items.map(x=>`<article class="item"><img src="${S.safe(x.image)}" alt=""><div><h3>${S.safe(x.name)}</h3><div class="muted">${S.safe(x.category)}</div><div class="qty"><button data-id="${Number(x.id)}" data-delta="-1" aria-label="Decrease">−</button><strong>${Number(x.quantity)}</strong><button data-id="${Number(x.id)}" data-delta="1" aria-label="Increase">+</button></div><button class="remove" data-remove="${Number(x.id)}">Remove</button></div><strong class="price">${S.money(Number(x.price)*Number(x.quantity))}</strong></article>`).join(''):'<p>Your bag is empty. <a href="index.html#signature">Explore watches →</a></p>';document.getElementById('subtotal').textContent=S.money(items.reduce((a,x)=>a+Number(x.price)*Number(x.quantity),0));document.getElementById('checkout').style.pointerEvents=items.length?'auto':'none';document.getElementById('checkout').style.opacity=items.length?'1':'.45'}document.getElementById('items').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;let a=S.read(),id=Number(b.dataset.id||b.dataset.remove);if(b.dataset.remove){a=a.filter(x=>Number(x.id)!==id)}else{let x=a.find(x=>Number(x.id)===id);if(x)x.quantity=Math.max(1,Math.min(99,Number(x.quantity)+Number(b.dataset.delta)))}S.write(a);render()});render();</script></body></html>
