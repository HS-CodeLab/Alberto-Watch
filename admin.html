<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard | Alberto Clock</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet"><style> :root{--navy:#09243b;--gold:#b59665;--cream:#f3eee7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}header{background:#09243b;color:#fff;padding:22px max(5%,calc((100% - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}header strong{font:27px 'Playfair Display',serif;letter-spacing:3px}nav{display:flex;gap:20px;font-size:13px}main{max-width:1180px;margin:auto;padding:60px 22px;min-height:65vh}h1,h2{font-family:'Playfair Display',serif}h1{font-size:clamp(36px,5vw,56px);margin:0 0 12px}.sub{color:#65717c;margin-bottom:36px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:25px}.panel{background:#fff;border:1px solid #e4ddd2;border-radius:15px;padding:25px;margin-bottom:18px;box-shadow:0 12px 30px #09243b0b}.item{display:grid;grid-template-columns:100px 1fr auto;gap:20px;align-items:center;border-bottom:1px solid #eee5db;padding:18px 0}.item:last-child{border:0}.item img{width:100px;height:110px;object-fit:cover;border-radius:8px}.item h3{font:21px 'Playfair Display',serif;margin:0 0 8px}.muted{color:#78818a;font-size:12px}.qty{display:flex;gap:12px;align-items:center;margin-top:14px}.qty button,.remove{background:#fff;border:1px solid #d9c9b0;padding:7px 11px;border-radius:6px;color:#09243b}.remove{margin-top:10px}.total{display:flex;justify-content:space-between;gap:15px;padding:12px 0;border-bottom:1px solid #e7dfd5}.total.final{font-size:22px;font-weight:700;border:0}.btn{background:#09243b;color:white;border:0;border-radius:30px;padding:15px 24px;font-size:12px;font-weight:700;letter-spacing:1px;display:inline-block;text-align:center;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.btn.gold{background:#b59665;color:#09243b}.wide{width:100%;margin-top:22px}label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field{margin-bottom:17px}input,textarea,select{width:100%;border:1px solid #d9d4cb;border-radius:8px;background:white;padding:14px;font:14px 'DM Sans',sans-serif;color:#09243b}textarea{min-height:100px}footer{background:#061827;color:#c2cbd2;padding:35px;text-align:center;font-size:12px}.notice{padding:15px;background:#f8f2e8;border-left:3px solid #b59665;line-height:1.7;font-size:13px;margin:18px 0}.error{color:#ad3030;font-size:13px;line-height:1.6}.ok{color:#236c49;font-size:13px}.actions{display:flex;gap:12px;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid #e7dfd5;padding:13px 9px;vertical-align:top}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #b59665;outline-offset:3px}@media(max-width:750px){.layout{grid-template-columns:1fr}.item{grid-template-columns:75px 1fr;gap:12px}.item img{width:75px;height:90px}.item .price{grid-column:2}main{padding:40px 15px}.panel{padding:17px}} </style></head><body><header><a href="index.html"><strong>ALBERTO CLOCK</strong></a><nav><a href="index.html">Home</a><a href="index.html#signature">Collections</a><a href="cart.html">Cart <span id="cartCount">0</span></a></nav></header><main><h1>Orders Dashboard</h1><p class="sub">Authorized Alberto Clock staff only.</p><div class="panel" id="loginPanel"><h2>Admin Sign In</h2><form id="login"><div class="field"><label>Email</label><input type="email" id="email" required autocomplete="username"></div><div class="field"><label>Password</label><input type="password" id="password" required autocomplete="current-password"></div><button class="btn" type="submit">SIGN IN</button><p class="error" id="loginError"></p></form></div><div id="dashboard" hidden><div class="actions" style="margin-bottom:20px"><button class="btn" id="refresh">Refresh orders</button><button class="btn" id="logout">Sign out</button></div><div class="panel tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Subtotal</th><th>Status</th><th>Update</th></tr></thead><tbody id="orders"></tbody></table><p id="dashMessage" role="status"></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></main><footer>ALBERTO CLOCK · MORE THAN JUST TIME</footer><script src="config.js"></script><script src="store.js"></script><script>function refreshCount(){document.getElementById('cartCount').textContent=AlbertoStore.count()}refreshCount();window.addEventListener('alberto-cart-changed',refreshCount);</script><script>let client=null;const statuses=['pending_whatsapp','confirmed','processing','shipped','delivered','cancelled'];const loginPanel=document.getElementById('loginPanel'),dashboard=document.getElementById('dashboard'),msg=document.getElementById('dashMessage');if(ALB_CONFIG.supabaseUrl&&ALB_CONFIG.supabaseAnonKey)client=window.supabase.createClient(ALB_CONFIG.supabaseUrl,ALB_CONFIG.supabaseAnonKey);else document.getElementById('loginError').textContent='Configure config.js first.';async function authView(){const {data:{user}}=await client.auth.getUser();if(!user){loginPanel.hidden=false;dashboard.hidden=true;return}const {data:staff}=await client.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(!staff){loginPanel.hidden=false;dashboard.hidden=true;document.getElementById('loginError').textContent='This account has no admin access.';return}loginPanel.hidden=true;dashboard.hidden=false;loadOrders()}document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();if(!client)return;const {error}=await client.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});document.getElementById('loginError').textContent=error?.message||'';if(!error)authView()});async function loadOrders(){msg.textContent='Loading...';const {data,error}=await client.from('orders').select('id,order_number,customer_name,phone,city,address,subtotal,status,created_at,order_items(product_name,quantity,unit_price)').order('created_at',{ascending:false}).limit(100);if(error){msg.textContent=error.message;return}msg.textContent=data.length?'Showing latest 100 orders.':'No orders yet.';document.getElementById('orders').innerHTML=data.map(o=>`<tr><td><b>${AlbertoStore.safe(o.order_number)}</b><br><small>${new Date(o.created_at).toLocaleString()}</small></td><td>${AlbertoStore.safe(o.customer_name)}<br>${AlbertoStore.safe(o.phone)}<br>${AlbertoStore.safe(o.city)}<br><small>${AlbertoStore.safe(o.address)}</small></td><td>${(o.order_items||[]).map(x=>AlbertoStore.safe(x.product_name)+' × '+x.quantity).join('<br>')}</td><td>${AlbertoStore.money(o.subtotal)}</td><td>${AlbertoStore.safe(o.status)}</td><td><select data-id="${o.id}">${statuses.map(s=>`<option value="${s}" ${s===o.status?'selected':''}>${s.replaceAll('_',' ')}</option>`).join('')}</select><button class="btn" data-save="${o.id}" style="margin-top:8px">Save</button></td></tr>`).join('')}document.getElementById('orders').addEventListener('click',async e=>{let b=e.target.closest('[data-save]');if(!b)return;b.disabled=true;const status=b.parentElement.querySelector('select').value;const {error}=await client.from('orders').update({status}).eq('id',b.dataset.save);msg.textContent=error?error.message:'Order updated.';b.disabled=false;if(!error)loadOrders()});document.getElementById('refresh').onclick=loadOrders;document.getElementById('logout').onclick=async()=>{await client.auth.signOut();authView()};if(client)authView();</script></body></html>
